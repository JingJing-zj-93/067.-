<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>滑动门页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "微软雅黑";
        }
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        input {
            display: none;
        }
        .menu-wrap{
            width: 200px;
            background-color: #222;
            color:#fff;
        }
        .first-title{
            width:100%;
            padding:26px 16px;
            font-size:18px;
            cursor:pointer;
            border-bottom:1px solid #444;
            display:block;
        }
        .first-title:hover{
            background:#333;
        }
        .slide-wrap{
            flex:1;
            position:relative;
        }
        .slide-panel{
            position:absolute;
            width:100%;
            height:100%;
            left:100%;
            background:#fff;
            padding:60px;
            transition: left 0.4s ease;
        }
        #tab1:checked ~ .slide-wrap #p1,
        #tab2:checked ~ .slide-wrap #p2,
        #tab3:checked ~ .slide-wrap #p3{
            left:0;
        }
        .slide-panel h2{
            font-size:28px;
            margin-bottom:30px;
        }
        .slide-panel p{
            font-size:18px;
            margin:16px 0;
        }
    </style>
</head>
<body>
    <input type="radio" name="tab" id="tab1">
    <input type="radio" name="tab" id="tab2">
    <input type="radio" name="tab" id="tab3">
    <div class="menu-wrap">
        <label for="tab1" class="first-title">第一章</label>
        <label for="tab2" class="first-title">第二章</label>
        <label for="tab3" class="first-title">第三章</label>
    </div>
    <div class="slide-wrap">
        <div class="slide-panel" id="p1">
            <h2>第一章</h2>
            <p>1.1 小节：内容</p >
            <p>1.2 小节：内容</p >
            <p>1.3 小节：内容</p >
        </div>
        <div class="slide-panel" id="p2">
            <h2>第二章</h2>
            <p>2.1 小节：内容</p >
            <p>2.2 小节：内容</p >
            <p>2.3 小节：内容</p >
        </div>
        <div class="slide-panel" id="p3">
            <h2>第三章</h2>
            <p>3.1 小节：内容</p >
            <p>3.2 小节：内容</p >
            <p>3.3 小节：内容</p >
        </div>
    </div>
</body>
</html>
